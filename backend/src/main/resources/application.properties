# ---------------- App ----------------
spring.application.name=studentmanagement

# ---------------- Server ----------------
# PORT is injected automatically by most hosts (Render, Railway); falls back
# to 8080 for local development.
server.port=${PORT:8080}

# ---------------- Oracle Datasource ----------------
# All values are overridable via environment variables so real credentials
# never need to live in this file. Local defaults below match a typical
# Oracle XE dev setup.
#   ORACLE_URL       e.g. jdbc:oracle:thin:@localhost:1521:XE
#   ORACLE_USERNAME
#   ORACLE_PASSWORD
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521:orcl}
spring.datasource.username=${ORACLE_USERNAME:HR}
spring.datasource.password=${ORACLE_PASSWORD:hr}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---------------- JPA / Hibernate ----------------
# update = creates/updates tables automatically from your entities (handy for
# dev/demo). Switch to 'validate' + a migration tool (Flyway/Liquibase) once
# the schema is stable for a real production app.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# show-sql/format-sql default to false now - logging every query (formatted,
# multi-line) adds real per-request overhead. Flip SHOW_SQL=true locally
# when you actually need to debug a query.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.community.dialect.Oracle10gDialect
# Keeps the Hibernate session open only for the duration of the transaction
# instead of the whole request/response cycle. With it on (Spring's default)
# every request holds a DB connection the whole time it's rendering the
# response, which is what starves the pool first under load.
spring.jpa.open-in-view=false
# Batches related inserts/updates into fewer round-trips to the DB.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------- Connection pool (HikariCP) ----------------
# Defaults are conservative for a small dev DB; raise via env vars in
# production once you know real concurrent load.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}

# ---------------- Response compression ----------------
# Gzips JSON/text responses over ~1KB - the student/user list payloads are
# well above that threshold, so this cuts real transfer time on slower
# connections without any code change.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ---------------- Auth / JWT ----------------
# Secret used to sign login tokens. MUST be overridden via the JWT_SECRET
# env var in any real deployment — the fallback below is for local dev only.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-this-should-be-at-least-32-bytes-long}
# Token lifetime in milliseconds. Default: 24 hours.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------- CORS ----------------
# Comma-separated list of origins allowed to call this API. Add your deployed
# frontend's URL here in production (e.g. https://your-app.vercel.app).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------------- Actuator (health checks for hosting platforms) ----------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------- API docs ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
