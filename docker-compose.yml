# Local full-stack setup: Oracle XE + Spring Boot API + Angular (served via nginx).
# Usage:
#   cp .env.example .env      # then edit .env if you want different credentials
#   docker compose up --build
#
# Frontend:  http://localhost:4200
# API:       http://localhost:8080
# Swagger:   http://localhost:8080/swagger-ui.html

services:
  db:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-student123}
      APP_USER: ${ORACLE_USERNAME:-studentapp}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-student123}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORACLE_URL: jdbc:oracle:thin:@db:1521/XEPDB1
      ORACLE_USERNAME: ${ORACLE_USERNAME:-studentapp}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-student123}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-this-should-be-at-least-32-bytes-long}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  oracle-data:
