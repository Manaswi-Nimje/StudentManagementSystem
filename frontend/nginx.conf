server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: fall back to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
