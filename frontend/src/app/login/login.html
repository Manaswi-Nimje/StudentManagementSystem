<div class="auth-screen">

  <div class="auth-panel">
    <a routerLink="/" class="brand">
      <span class="brand-mark">GB</span>
      <div class="brand-text">
        <strong>Gradebook</strong>
        <span>Student Records Portal</span>
      </div>
    </a>

    <blockquote>
      "A ledger is only as useful as it is current. Gradebook keeps ours honest."
    </blockquote>
    <span class="quote-attr">— Office of the Registrar</span>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form">
      <div class="auth-head">
        <h1>Welcome back</h1>
        <p>Sign in to reach your dashboard and student ledger.</p>
      </div>

      <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>


      <form (ngSubmit)="submit()" #f="ngForm" novalidate>
        <label class="field">
          <span>Username</span>
          <input
            type="text"
            name="username"
            autocomplete="username"
            placeholder="e.g. registrar_admin"
            [(ngModel)]="username"
            required
          >
        </label>

        <label class="field">
          <div class="field-row">
            <span>Password</span>
            <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              [(ngModel)]="password"
              required
            >
            <button type="button" class="toggle-visibility" (click)="showPassword = !showPassword">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </label>

        <button type="submit" class="btn-primary btn-block" [disabled]="submitting">
          {{ submitting ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <p class="switch-line">
        Don't have an account? <a routerLink="/register">Create one</a>
      </p>
    </div>
  </div>

</div>
